name: Idea Capture
subname: idea-capture
description: Turn an unstructured idea into a durable structured record.
inputs:
  idea: {type: text, required: true}
  category: {type: text, required: false}
  priority: {type: text, required: false}
use_case: Capture every new idea before it is lost.
default:
  category: General
  priority: Medium
result:
  type: notion_record
  description: Structured idea record ready for expansion or research.
revolt: Structured idea record created in Notion.
version: 1.0.0
type: core
status: active
